apiVersion: v1
kind: Service
metadata:
  name: {{ include "openldap.fullname" . }}
  labels: {{- include "openldap.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "openldap.selector" . | nindent 4 }}
  ports:
  - name: ldap
    port: {{ .Values.service.port }}
    targetPort: ldap
