name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'      # weekly: pick up Alpine's OpenLDAP security fixes
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      openldap: ${{ steps.ver.outputs.openldap }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: |
          v=$(docker run --rm alpine:3.22 sh -c 'apk info -q openldap 2>/dev/null; apk add --no-cache -q openldap >/dev/null 2>&1; apk info openldap | head -1' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
          echo "openldap=$v" >> "$GITHUB_OUTPUT"; echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"; echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.minor }}
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.openldap }}
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.openldap }}-${{ steps.ver.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OpenLDAP ${{ steps.ver.outputs.openldap }} on Alpine, env-configured, LDIF bootstrap
            org.opencontainers.image.licenses=MIT
  chart:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/openldap
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          helm package charts/openldap --app-version "${{ needs.build.outputs.openldap }}" -d /tmp/chart
          helm push /tmp/chart/openldap-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
